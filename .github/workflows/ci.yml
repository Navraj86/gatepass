name: CI

# Pushes to main run this through release.yml, so every deployed commit passed it.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm --filter @gatepass/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  test:
    name: Tests on PostgreSQL and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gatepass
          POSTGRES_PASSWORD: gatepass
          POSTGRES_DB: gatepass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatepass -d gatepass_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the concurrency suite (C1 to C9) against the real database.
      - run: pnpm --filter @gatepass/api test
        env:
          TEST_REDIS_URL: redis://localhost:6379
