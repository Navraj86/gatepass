name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gatepass
          POSTGRES_PASSWORD: gatepass
          POSTGRES_DB: gatepass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatepass -d gatepass_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    
    defaults:
      run:
        working-directory: apps/api
    
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
