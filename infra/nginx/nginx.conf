# Cloudflare terminates TLS for browsers and connects here with an Origin Certificate
# (SSL mode Full, strict). Nginx routes /api to two API instances and pages to Next.js.

# Restore the visitor's IP from Cloudflare's header, trusting it only from Cloudflare.
# Ranges from https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

log_format gatepass escape=json '{"time":"$time_iso8601","request_id":"$request_id","ip":"$remote_addr",'
                            '"method":"$request_method","uri":"$uri","status":$status,'
                            '"bytes":$body_bytes_sent,"duration":$request_time,'
                            '"upstream":"$upstream_addr","upstream_duration":"$upstream_response_time"}';
# Docker DNS: containers get new IPs when a deploy recreates them, so re-resolve every few seconds.
resolver 127.0.0.11 valid=5s ipv6=off;

# least_conn spreads long-lived SSE streams evenly; a failing instance is skipped for 10 s.
upstream api {
    zone api 64k;
    least_conn;
    server api-1:4000 max_fails=3 fail_timeout=10s resolve;
    server api-2:4000 max_fails=3 fail_timeout=10s resolve;
    keepalive 32;
}

upstream web {
    zone web 64k;
    server web:3000 resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gatepass.navraj.dev;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /dev/stdout gatepass;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id      $request_id;
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $request_id always;

    # Live seat map: no buffering or compression, and let streams stay open for an hour.
    # When an instance shuts down it ends its streams and EventSource reconnects to the other.
    location ~ ^/api/events/[^/]+/seats/stream$ {
        proxy_pass http://api;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Payment provider webhooks must reach a live instance even mid-deploy.
    location /api/ {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 30s;
    }

    # Next.js build assets are content hashed.
    location /_next/static/ {
        proxy_pass http://web;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Request-Id $request_id always;
    }

    location / {
        proxy_pass http://web;
    }
}
